<text x="544" y="230" text-anchor="middle" fill="#8ce7d5" font-size="12">match functions</text>
<rect x="658" y="18" width="444" height="362" rx="14" fill="white" stroke="#b7dccc"/>
<text x="678" y="51" font-size="19" font-weight="700" fill="#183553">Recovered library information</text>
<text x="678" y="82" font-size="14" fill="#61768a">Library</text>
<text x="762" y="82" font-size="15" font-weight="600" fill="#183553">lodash</text>
<text x="901" y="82" font-size="14" fill="#61768a">Version</text>
<text x="971" y="82" font-size="15" font-weight="600" fill="#183553">4.17.21</text>
<text x="678" y="109" font-size="14" fill="#61768a">Bundling</text>
<text x="762" y="109" font-size="14" fill="#183553">webpack 5 style · CommonJS exports</text>
