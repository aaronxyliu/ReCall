<text x="690" y="155" font-size="12" font-weight="600" fill="#38765f">Original source · lodash/isObject.js</text>
<text x="690" y="184" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">function isObject(value) {</text><text x="690" y="207" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">  var type = typeof value;</text><text x="690" y="230" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">  return value != null &amp;&amp;</text><text x="690" y="253" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">    (type == &#x27;object&#x27; ||</text><text x="690" y="276" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">     type == &#x27;function&#x27;);</text><text x="690" y="299" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#183f36" xml:space="preserve">}</text><text x="678" y="355" font-size="14" fill="#38765f">Bundled location → original library implementation</text>
